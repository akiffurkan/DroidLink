name: Build macOS DroidLink

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Show System Info
      run: |
        uname -a
        sw_vers
        swift --version

    - name: Run Swift Unit Tests
      run: |
        cd macOS
        swift test

    - name: Build Universal App (x86_64 + arm64)
      run: |
        cd macOS
        swift build -c release --arch arm64 --arch x86_64
        
        mkdir -p build/universal
        BIN_PATH=$(find .build -type f -name "DroidLink" -perm +111 | grep -E "Release|release" | head -n 1)
        cp "$BIN_PATH" build/universal/DroidLink
        lipo -info build/universal/DroidLink

    - name: Create macOS App Bundle
      run: |
        cd macOS
        mkdir -p "build/DroidLink.app/Contents/MacOS"
        mkdir -p "build/DroidLink.app/Contents/Resources"
        
        cp build/universal/DroidLink "build/DroidLink.app/Contents/MacOS/DroidLink"
        chmod +x "build/DroidLink.app/Contents/MacOS/DroidLink"
        
        cat << 'EOF' > "build/DroidLink.app/Contents/Info.plist"
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>DroidLink</string>
            <key>CFBundleIdentifier</key>
            <string>com.droidlink.macos</string>
            <key>CFBundleName</key>
            <string>DroidLink</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSUIElement</key>
            <true/>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
        </dict>
        </plist>
        EOF
        
        cd build
        zip -r DroidLink-macOS-Universal.zip DroidLink.app

    - name: Upload macOS App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DroidLink-macOS-Universal
        path: macOS/build/DroidLink-macOS-Universal.zip
