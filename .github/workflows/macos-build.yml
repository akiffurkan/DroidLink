name: Build macOS DroidLink

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Run Swift Unit Tests
      run: |
        cd macOS
        swift test

    - name: Build Universal Binary (Intel x86_64 + Apple Silicon arm64)
      run: |
        cd macOS
        # Intel x86_64 Derlemesi (Hackintosh i9-13900HX uyumlu)
        swift build -c release --triple x86_64-apple-macosx
        # Apple Silicon arm64 Derlemesi
        swift build -c release --triple arm64-apple-macosx
        
        # Universal Fat Binary oluştur
        mkdir -p build/universal
        lipo -create \
          .build/x86_64-apple-macosx/release/DroidLink \
          .build/arm64-apple-macosx/release/DroidLink \
          -output build/universal/DroidLink
          
        lipo -info build/universal/DroidLink

    - name: Package macOS App Bundle
      run: |
        cd macOS
        mkdir -p "build/DroidLink.app/Contents/MacOS"
        mkdir -p "build/DroidLink.app/Contents/Resources"
        
        cp build/universal/DroidLink "build/DroidLink.app/Contents/MacOS/DroidLink"
        chmod +x "build/DroidLink.app/Contents/MacOS/DroidLink"
        
        # Basit Info.plist
        cat << 'EOF' > "build/DroidLink.app/Contents/Info.plist"
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>DroidLink</string>
            <key>CFBundleIdentifier</key>
            <string>com.droidlink.macos</string>
            <key>CFBundleName</key>
            <string>DroidLink</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSUIElement</key>
            <true/>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
        </dict>
        </plist>
        EOF
        
        cd build
        zip -r DroidLink-macOS-Universal.zip DroidLink.app

    - name: Upload macOS App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DroidLink-macOS-Universal
        path: macOS/build/DroidLink-macOS-Universal.zip
